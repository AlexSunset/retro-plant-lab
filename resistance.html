<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отделение Резистентности | T-KAT Retro</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="resistance-page">
    <!-- Верхняя панель -->
    <header class="samples-header">
        <a href="garden.html" class="btn-back">← В лабораторию</a>
        <div class="header-title">
            <span class="header-icon">🛡️</span>
            <span>Отделение Резистентности и Иммунитета</span>
        </div>
        <button class="btn-add-task" id="addReviewBtn" title="Добавить отзыв">+ Стимуляция жизненных сил</button>
    </header>

    <div class="samples-container">
        <!-- Описание -->
        <div class="samples-intro">
            <h1>🛡️ Отделение Резистентности</h1>
            <p>Вдохновляющие отзывы и благодарность коллегам</p>
            <p class="samples-hint">💡 Делитесь приятными словами о работе команды</p>
        </div>

        <!-- Список отзывов -->
        <div class="resistance-list" id="resistanceGrid">
            <!-- Отзывы будут добавлены через JS -->
        </div>
    </div>

    <!-- Модальное окно для отзыва -->
    <div class="modal-overlay" id="reviewModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3>💪 Стимуляция жизненных сил</h3>
                <button class="modal-close" id="closeReviewModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="reviewText">Текст отзыва</label>
                    <textarea 
                        id="reviewText" 
                        placeholder="Напишите вдохновляющий отзыв о коллеге..."
                        maxlength="1000"
                        rows="4"
                    ></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" id="cancelReviewBtn">Отмена</button>
                <button class="btn-submit" id="submitReviewBtn">Добавить отзыв</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="resistance.js"></script>
</body>
</html>
