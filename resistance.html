<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отделение Резистентности | Ретро Адаптация</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="resistance-page">
    <!-- Шапка -->
    <header class="resistance-header">
        <div class="header-left">
            <a href="garden.html" class="btn-back" title="Вернуться в лабораторию">
                ← На базу
            </a>
            <div class="header-title">
                <span class="icon">🛡️</span>
                <span>Отделение Резистентности</span>
            </div>
        </div>
        <div class="header-right">
            <span id="userDisplay" class="user-display"></span>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="resistance-container">
        <div class="resistance-intro">
            <h1>🌿 Укрепление Иммунитета</h1>
            <p>Вдохновляющие отзывы и благодарность коллегам</p>
        </div>

        <!-- Кнопка добавления -->
        <button id="reviewModalBtn" class="btn-add-protocol">
            <span class="btn-icon">💚</span>
            <span>Стимуляция жизненных сил</span>
        </button>

        <!-- Сетка отзывов -->
        <div id="reviewsGrid" class="reviews-grid">
            <div class="loading-data">Загрузка отзывов...</div>
        </div>
    </main>

    <!-- Модальное окно для отзыва -->
    <div id="reviewModal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <h2>💚 Стимуляция жизненных сил</h2>
                <button id="modalClose" class="modal-close">×</button>
            </div>
            <div class="modal-body">
                <p class="modal-hint">Поделитесь благодарностью или вдохновляющим отзывом о коллеге</p>
                <textarea 
                    id="reviewText" 
                    placeholder="Хочу поблагодарить коллегу за..." 
                    maxlength="1000"
                ></textarea>
                <div class="char-count">
                    <span id="reviewCharCount">0</span> / 1000
                </div>
            </div>
            <div class="modal-footer">
                <button id="cancelBtn" class="btn-cancel">Отмена</button>
                <button id="submitReviewBtn" class="btn-submit">Добавить</button>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="resistance.js"></script>
</body>
</html>
