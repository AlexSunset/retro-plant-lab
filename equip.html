<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Зона Экипировки | T-KAT Retro</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="equip-page">
    <!-- Верхняя панель -->
    <header class="samples-header">
        <a href="garden.html" class="btn-back">← В лабораторию</a>
        <div class="header-title">
            <span class="header-icon">👔</span>
            <span>Зона Экипировки</span>
        </div>
        <div style="width: 140px;"></div>
    </header>

    <div class="equip-container">
        <!-- Описание -->
        <div class="equip-intro">
            <h1>👔 Зона Экипировки</h1>
            <p>Выберите аватар для идентификации в лаборатории</p>
        </div>

        <!-- Сетка аватарок -->
        <div class="avatar-grid" id="avatarGrid">
            <!-- Аватарки генерируются через JS -->
        </div>

        <!-- Кнопка надеть -->
        <button class="equip-btn" id="equipBtn" disabled>
            🎒 Надеть экипировку
        </button>

        <!-- Кнопка перейти в лабораторию (скрыта по умолчанию) -->
        <a href="garden.html" class="equip-btn" id="toLabBtn" style="display: none;">
            🔬 Перейти в лабораторию
        </a>

        <!-- Текущая экипировка -->
        <div class="current-equip" id="currentEquip" style="display: none;">
            <h3>Ваша экипировка:</h3>
            <div class="current-avatar">
                <span class="avatar-emoji" id="currentAvatarDisplay">🧑‍🔬</span>
                <span id="currentAvatarName">Учёный</span>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="equip.js"></script>
</body>
</html>
