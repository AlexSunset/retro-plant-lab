<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Зона Экипировки - Ретро Лаборатория</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Шапка как в хранилище -->
        <header class="samples-header">
            <a href="garden.html" class="back-btn">← В лабораторию</a>
            <h1>👔 Зона Экипировки</h1>
            <div style="width: 100px;"></div> <!-- Spacer для центрирования -->
        </header>

        <!-- Основной контент -->
        <main class="equip-main">
            <div class="equip-info">
                <p>Выберите аватар для идентификации в лаборатории</p>
            </div>

            <!-- Сетка аватарок -->
            <div class="avatar-grid" id="avatarGrid">
                <!-- Аватарки генерируются через JS -->
            </div>

            <!-- Кнопка надеть -->
            <button class="equip-btn" id="equipBtn" disabled>
                🎒 Надеть экипировку
            </button>

            <!-- Текущая экипировка -->
            <div class="current-equip" id="currentEquip" style="display: none;">
                <h3>Ваша экипировка:</h3>
                <div class="current-avatar">
                    <span class="avatar" id="currentAvatarDisplay">🧑‍🔬</span>
                    <span id="currentAvatarName">Учёный</span>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase Compat версии -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database-compat.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const firebaseConfig = {
                apiKey: "AIzaSyA7Zpsng2b6I02RZ7r7VtwXzzN-gR_kNmk",
                authDomain: "retro-tkat.firebaseapp.com",
                databaseURL: "https://retro-tkat-default-rtdb.europe-west1.firebasedatabase.app",
                projectId: "retro-tkat",
                storageBucket: "retro-tkat.firebasestorage.app",
                messagingSenderId: "526671550405",
                appId: "1:526671550405:web:fded37933b6c890ed95dac",
                measurementId: "G-EVC7M9W82C"
            };

            firebase.initializeApp(firebaseConfig);
            const database = firebase.database();

        // Проверка имени
        const scientistName = localStorage.getItem('scientistName');
        if (!scientistName || scientistName === 'undefined' || scientistName === 'null') {
            console.error('❌ Нет имени учёного, возврат на титульную');
            window.location.href = 'index.html';
        }

        const sessionId = localStorage.getItem('sessionId') || 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('sessionId', sessionId);

        console.log('👔 Зона Экипировки загружена');
        console.log('👨‍🔬 Учёный в зоне экипировки:', scientistName);

        // Список аватарок
        const avatars = [
            { emoji: '🧑‍🔬', name: 'Учёный' },
            { emoji: '👨‍🔬', name: 'Учёный М' },
            { emoji: '👩‍🔬', name: 'Учёный Ж' },
            { emoji: '🧙‍♂️', name: 'Алхимик' },
            { emoji: '🧙‍♀️', name: 'Алхимик Ж' },
            { emoji: '🦸‍♂️', name: 'Герой' },
            { emoji: '🦸‍♀️', name: 'Героиня' },
            { emoji: '🤖', name: 'Робот' },
            { emoji: '👽', name: 'Пришелец' },
            { emoji: '🦖', name: 'Динозавр' },
            { emoji: '🦄', name: 'Единорог' },
            { emoji: '🐱‍🚀', name: 'Котокосмонавт' },
            { emoji: '🧟‍♂️', name: 'Зомби' },
            { emoji: '🧞‍♂️', name: 'Джинн' },
            { emoji: '👻', name: 'Призрак' },
            { emoji: '🦹‍♂️', name: 'Злодей' },
            { emoji: '🦹‍♀️', name: 'Злодейка' },
            { emoji: '🕵️‍♂️', name: 'Детектив' },
            { emoji: '🕵️‍♀️', name: 'Детектив Ж' },
            { emoji: '🧑‍💼', name: 'Менеджер' }
        ];

        let selectedAvatar = null;

        // Рендеринг аватарок
        const avatarGrid = document.getElementById('avatarGrid');
        
        avatars.forEach(avatar => {
            const avatarEl = document.createElement('div');
            avatarEl.className = 'avatar-card';
            avatarEl.innerHTML = `
                <span class="avatar-emoji">${avatar.emoji}</span>
                <span class="avatar-name">${avatar.name}</span>
            `;
            avatarEl.addEventListener('click', () => {
                // Снять выделение со всех
                document.querySelectorAll('.avatar-card').forEach(card => {
                    card.classList.remove('selected');
                });
                // Выделить текущую
                avatarEl.classList.add('selected');
                selectedAvatar = avatar;
                // Активировать кнопку
                document.getElementById('equipBtn').disabled = false;
            });
            avatarGrid.appendChild(avatarEl);
        });

        // Проверка текущей экипировки
        const equipRef = database.ref(`equip/${sessionId}`);
        equipRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && data.avatar) {
                document.getElementById('currentEquip').style.display = 'block';
                document.getElementById('currentAvatarDisplay').textContent = data.avatar.emoji;
                document.getElementById('currentAvatarName').textContent = data.avatar.name;
                console.log('✅ Текущая экипировка:', data.avatar);
            }
        });

        // Кнопка "Надеть экипировку"
        document.getElementById('equipBtn').addEventListener('click', async () => {
            if (!selectedAvatar) {
                alert('Выберите аватарку!');
                return;
            }

            try {
                await equipRef.set({
                    name: scientistName,
                    avatar: selectedAvatar,
                    equippedAt: Date.now()
                });
                console.log('✅ Экипировка надета:', selectedAvatar);
                
                // Показать текущую экипировку
                document.getElementById('currentEquip').style.display = 'block';
                document.getElementById('currentAvatarDisplay').textContent = selectedAvatar.emoji;
                document.getElementById('currentAvatarName').textContent = selectedAvatar.name;
                
                alert(`Экипировка надета: ${selectedAvatar.emoji} ${selectedAvatar.name}`);
            } catch (error) {
                console.error('❌ Ошибка сохранения экипировки:', error);
                alert('Ошибка сохранения экипировки');
            }
        });
        });
    </script>
</body>
</html>
