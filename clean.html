<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Очистка Генома | T-KAT Retro</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="clean-page">
    <!-- Верхняя панель -->
    <header class="samples-header">
        <a href="garden.html" class="btn-back">← В лабораторию</a>
        <div class="header-title">
            <span class="header-icon">🧬</span>
            <span>Очистка Генома</span>
        </div>
        <button class="btn-add-task" id="addDefectBtn" title="Добавить дефект">+ Дефектный геном</button>
    </header>

    <div class="samples-container">
        <!-- Описание -->
        <div class="samples-intro">
            <h1>🧬 Очистка Генома</h1>
            <p>Выявляем проблемные моменты и находим пути их решения</p>
            <p class="samples-hint">💡 Добавляйте дефектные гены и предлагайте стратегии извлечения</p>
        </div>

        <!-- Список дефектов -->
        <div class="clean-list" id="cleanGrid">
            <!-- Дефекты будут добавлены через JS -->
        </div>
    </div>

    <!-- Модальное окно для дефекта -->
    <div class="modal-overlay" id="defectModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3>🔴 Добавить дефектный геном</h3>
                <button class="modal-close" id="closeDefectModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="defectText">Описание проблемы</label>
                    <textarea 
                        id="defectText" 
                        placeholder="Опишите негативный момент..."
                        maxlength="1000"
                        rows="4"
                    ></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" id="cancelDefectBtn">Отмена</button>
                <button class="btn-submit" id="submitDefectBtn">Добавить дефект</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно для стратегии -->
    <div class="modal-overlay" id="strategyModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3>🟢 Добавить стратегию извлечения</h3>
                <button class="modal-close" id="closeStrategyModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="strategyText">Описание решения</label>
                    <textarea 
                        id="strategyText" 
                        placeholder="Предложите путь решения..."
                        maxlength="1000"
                        rows="4"
                    ></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" id="cancelStrategyBtn">Отмена</button>
                <button class="btn-submit" id="submitStrategyBtn">Добавить стратегию</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="clean.js"></script>
</body>
</html>
