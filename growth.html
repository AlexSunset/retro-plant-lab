<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Модуляция Роста | T-KAT Retro</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="growth-page">
    <!-- Верхняя панель -->
    <header class="samples-header">
        <a href="garden.html" class="btn-back">← В лабораторию</a>
        <div class="header-title">
            <span class="header-icon">📈</span>
            <span>Модуляция Роста</span>
        </div>
        <button class="btn-add-task" id="addProtocolBtn" title="Добавить протокол">+ Протокол роста</button>
    </header>

    <div class="samples-container">
        <!-- Описание -->
        <div class="samples-intro">
            <h1>📈 Модуляция Роста</h1>
            <p>Предложения по улучшению процессов, подходов и методик</p>
            <p class="samples-hint">💡 Делитесь идеями по улучшению работы команды</p>
        </div>

        <!-- Список протоколов -->
        <div class="growth-list" id="growthGrid">
            <!-- Протоколы будут добавлены через JS -->
        </div>
    </div>

    <!-- Модальное окно для протокола -->
    <div class="modal-overlay" id="protocolModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3>📈 Добавить протокол роста</h3>
                <button class="modal-close" id="closeProtocolModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="protocolText">Описание улучшения</label>
                    <textarea 
                        id="protocolText" 
                        placeholder="Опишите ваше предложение по улучшению..."
                        maxlength="1000"
                        rows="4"
                    ></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" id="cancelProtocolBtn">Отмена</button>
                <button class="btn-submit" id="submitProtocolBtn">Добавить протокол</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="growth.js"></script>
</body>
</html>
