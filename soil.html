<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отсек с образцами почвы | T-KAT Retro</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="soil-page">
    <!-- Верхняя панель -->
    <header class="samples-header">
        <a href="garden.html" class="btn-back">← В лабораторию</a>
        <div class="header-title">
            <span class="header-icon">🌱</span>
            <span>Отсек с образцами почвы</span>
        </div>
        <div style="width: 80px;"></div> <!-- Пустой блок для центровки заголовка -->
    </header>

    <div class="samples-container">
        <!-- Описание -->
        <div class="samples-intro">
            <h1>🌱 Отсек с образцами почвы</h1>
            <p>Договорённости с предыдущих ретроспектив</p>
            <p class="samples-hint">💡 Отмечайте прогресс и оставляйте комментарии к каждой договорённости</p>
        </div>

        <!-- Список договорённостей -->
        <div class="samples-grid" id="agreementsGrid">
            <!-- Карточки будут добавлены через JS -->
        </div>
    </div>

    <!-- Модальное окно для комментария -->
    <div class="modal-overlay" id="commentModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3>💬 Добавить комментарий</h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body">
                <div class="task-info" id="modalAgreementInfo"></div>
                <textarea 
                    id="commentText" 
                    placeholder="Опишите ваш комментарий..."
                    maxlength="500"
                    rows="4"
                ></textarea>
                <div class="char-count"><span id="charCount">0</span>/500</div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" id="cancelBtn">Отмена</button>
                <button class="btn-submit" id="submitBtn">Добавить комментарий</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="soil.js"></script>
</body>
</html>
